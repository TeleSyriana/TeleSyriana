name: Phase 1 static preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'app-core.js'
      - 'employee-auth-v2.js'
      - 'employee-identity-store.js'
      - 'employee-identity-compat.js'
      - 'employee-directory.js'
      - 'employee-directory-core.js'
      - 'employees-ui.js'
      - 'employees-ui-core.js'
      - 'tickets.js'
      - 'tickets-core.js'
      - 'payroll.js'
      - 'payroll-core.js'
      - 'reports.js'
      - 'reports-core.js'
      - 'messages.js'
      - 'messages-core.js'
      - 'groups.js'
      - 'groups-core.js'
      - 'tools/phase1-static-preflight.mjs'
      - '.github/workflows/phase1-static-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    name: Validate current TeleSyriana runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic production-auth preflight
        run: node tools/phase1-static-preflight.mjs

      - name: Browser startup smoke with Firestore blocked
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase1-browser
          cd /tmp/phase1-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --silent puppeteer-core@24

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 > phase1-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          sleep 1

          cd /tmp/phase1-browser
          node --input-type=module > "$GITHUB_WORKSPACE/phase1-browser-smoke.log" 2>&1 <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const executablePath = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium-browser',
            '/usr/bin/chromium',
          ].find(fs.existsSync);
          if (!executablePath) throw new Error('No Chrome/Chromium executable found.');

          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          try {
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleRows = [];
            page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)));
            page.on('console', (message) => consoleRows.push(`[${message.type()}] ${message.text()}`));

            await page.setRequestInterception(true);
            page.on('request', (request) => {
              const url = request.url();
              if (url.includes('firestore.googleapis.com') || url.includes('google.firestore.v1.Firestore')) request.abort();
              else request.continue();
            });

            await page.goto('http://127.0.0.1:4173/index.html', {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });

            await page.waitForFunction(() => {
              const form = document.getElementById('login-form');
              const login = document.getElementById('login-screen');
              return Boolean(form && login && !login.classList.contains('hidden'));
            }, { timeout: 10_000 });

            await new Promise((resolve) => setTimeout(resolve, 750));

            const runtime = await page.evaluate(() => ({
              appLoaded: Boolean(document.getElementById('login-form')),
              loginVisible: !document.getElementById('login-screen')?.classList.contains('hidden'),
              dashboardHidden: document.getElementById('dashboard-screen')?.classList.contains('hidden') === true,
              projectsNavMounted: Boolean(document.getElementById('nav-projects-teams-v2')),
              employeesNavMounted: Boolean(document.getElementById('nav-employees-readonly')),
              quickFiltersMounted: Boolean(document.getElementById('phase5-ticket-quick-filters')) || Boolean(document.getElementById('ticket-filter-status')),
            }));

            const fallbackLogs = consoleRows.filter((row) => /Production V2 auth loader failed/i.test(row));
            console.log('runtime=' + JSON.stringify(runtime));
            console.log('fallback_logs=' + JSON.stringify(fallbackLogs));
            console.log('page_errors=' + JSON.stringify(pageErrors));
            console.log('console_tail=' + JSON.stringify(consoleRows.slice(-30)));

            if (!runtime.appLoaded || !runtime.loginVisible || !runtime.dashboardHidden) {
              throw new Error(`Production login UI did not initialize correctly: ${JSON.stringify(runtime)}`);
            }
            if (!runtime.projectsNavMounted || !runtime.employeesNavMounted) {
              throw new Error(`Expected management feature surfaces did not mount: ${JSON.stringify(runtime)}`);
            }
            if (fallbackLogs.length) {
              throw new Error(`Production V2 auth loader fell back unexpectedly: ${fallbackLogs.join(' | ')}`);
            }
            if (pageErrors.length) {
              throw new Error(`Uncaught browser errors: ${pageErrors.join(' | ')}`);
            }
          } finally {
            await browser.close();
          }
          NODE

          cat "$GITHUB_WORKSPACE/phase1-browser-smoke.log"

      - name: Upload browser smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-browser-smoke-output
          path: |
            phase1-browser-smoke.log
            phase1-browser-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only Firestore reachability probe
        shell: bash
        run: |
          set +e
          url='https://firestore.googleapis.com/v1/projects/telesyriana-ccms/databases/(default)/documents/employees/__telesyriana_phase1_read_probe__?key=AIzaSyDSvgD5GEZRE_zBzspoPr3pHQW1XOZr6yQ'
          code="$(curl --silent --show-error --output firestore-read-probe.json --write-out '%{http_code}' "$url")"
          curl_code=$?
          if [ "$curl_code" -ne 0 ]; then
            echo '::warning::Firestore reachability probe had a network error; offline browser validation already passed.'
          elif [ "$code" = '429' ]; then
            echo '::warning::Firestore quota is exhausted; offline browser validation already passed.'
          elif [ "$code" = '403' ]; then
            echo '::warning::Anonymous Firestore probe is permission-denied; this is acceptable for a read-only reachability probe.'
          elif [ "$code" = '200' ] || [ "$code" = '404' ]; then
            echo "Firestore reachability probe: HTTP $code"
          else
            echo "::warning::Unexpected Firestore probe status HTTP $code; production browser validation already passed."
          fi
          exit 0
