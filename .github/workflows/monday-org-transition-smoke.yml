name: Monday iPro Org Transition smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'employee-identity-seed.js'
      - 'employee-model.js'
      - 'employee-password-policy.js'
      - 'project-hierarchy-shadow.js'
      - 'ticket-runtime-policy-adapter.js'
      - 'tickets.js'
      - 'monday-auth-compat.js'
      - 'monday-org-transition-runtime.js'
      - 'phase2-projects-teams.js'
      - 'phase5-ticket-quick-filters.js'
      - 'phase4a-inactivity-watch.js'
      - 'phase4b-activity-telemetry.js'
      - 'functions-phase4b/watchdog-policy.js'
      - 'app.js'
      - 'tools/monday-org-transition-preflight.mjs'
      - '.github/workflows/monday-org-transition-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monday-transition:
    name: Verify Monday identities, login and UI scope
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Static safety
        shell: bash
        run: |
          set -euo pipefail
          for file in employee-identity-seed.js ticket-runtime-policy-adapter.js monday-auth-compat.js monday-org-transition-runtime.js phase2-projects-teams.js phase5-ticket-quick-filters.js phase4a-inactivity-watch.js phase4b-activity-telemetry.js tickets.js; do
            cp "$file" "/tmp/${file%.js}.mjs"
            node --check "/tmp/${file%.js}.mjs"
          done
          node --check functions-phase4b/watchdog-policy.js
          grep -q '2026-07-27T00:00:00+03:00' employee-identity-seed.js
          grep -q 'previousCcmsIds: \["9003"\]' employee-identity-seed.js
          grep -q 'ccmsId: "2002"' employee-identity-seed.js
          grep -q 'ccmsId: "9004"' employee-identity-seed.js
          grep -q 'credentialSetupRequired: true' employee-identity-seed.js
          grep -q 'mustChangePasswordOnFirstLogin: true' employee-identity-seed.js
          grep -q 'runtimeEscalationTarget' tickets.js
          grep -q 'escalatedTo: escalationTarget.ccmsId' tickets.js
          grep -Fq "import './monday-auth-compat.js';" app.js
          grep -Fq "import './app-core.js';" app.js
          auth_line="$(grep -nF "import './monday-auth-compat.js';" app.js | cut -d: -f1)"
          core_line="$(grep -nF "import './app-core.js';" app.js | cut -d: -f1)"
          test "$auth_line" -lt "$core_line"
          grep -Fq 'const VISIBLE_ROLES = new Set(["ceo", "acm", "hr"]);' phase2-projects-teams.js
          grep -q 'p5-source-filter-hidden' phase5-ticket-quick-filters.js
          if grep -q 'input.value = identity.previousCcmsIds' monday-org-transition-runtime.js; then
            echo '2002 must never be translated back to 9003.' >&2
            exit 1
          fi
          echo 'Monday transition static safety: PASS'

      - name: Run deterministic transition policy tests
        run: node tools/monday-org-transition-preflight.mjs

      - name: Browser real login and corrected mobile UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/telesyriana-monday-browser
          cd /tmp/telesyriana-monday-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --silent puppeteer-core@24

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 > monday-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          sleep 1

          cd /tmp/telesyriana-monday-browser
          node --input-type=module > "$GITHUB_WORKSPACE/monday-browser-smoke.log" 2>&1 <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(fs.existsSync);
          if (!executablePath) throw new Error('No Chrome/Chromium executable found.');
          const browser = await puppeteer.launch({ executablePath, headless:true, args:['--no-sandbox','--disable-dev-shm-usage'] });
          const MONDAY = Date.parse('2026-07-26T21:00:01Z');
          const source = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/monday-auth-compat.js', 'utf8');
          const passwords = [...source.matchAll(/password:\s*'([^']+)'/g)].map((match) => match[1]);
          if (passwords.length < 2) throw new Error('Could not load compatibility credentials for browser smoke.');
          const [reemaPassword, lanaPassword] = passwords;

          async function newPage() {
            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(String(error?.stack || error)));
            await page.setRequestInterception(true);
            page.on('request', (request) => {
              const url = request.url();
              if (url.includes('firestore.googleapis.com') || url.includes('google.firestore.v1.Firestore')) request.abort();
              else request.continue();
            });
            await page.evaluateOnNewDocument((monday) => {
              Date.now = () => monday;
              localStorage.setItem('telesyrianaLanguage', 'en');
            }, MONDAY);
            return { context, page, errors };
          }

          async function loginAndRead(ccmsId, password) {
            const { context, page, errors } = await newPage();
            try {
              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil:'domcontentloaded', timeout:30_000 });
              await page.waitForSelector('#login-form', { timeout:10_000 });
              await page.type('#ccmsId', ccmsId);
              await page.type('#password', password);
              await page.click('#login-form button[type="submit"]');
              await page.waitForFunction(() => {
                const raw = localStorage.getItem('telesyrianaUser');
                if (!raw) return false;
                try { return Boolean(JSON.parse(raw)?.id); } catch { return false; }
              }, { timeout:15_000 });
              await page.waitForFunction(() => {
                const dashboard = document.getElementById('dashboard-screen');
                const subtitle = String(document.getElementById('welcome-subtitle')?.textContent || '').trim();
                return Boolean(dashboard && !dashboard.classList.contains('hidden') && subtitle);
              }, { timeout:15_000 });
              const result = await page.evaluate(() => ({
                session:JSON.parse(localStorage.getItem('telesyrianaUser') || 'null'),
                subtitle:String(document.getElementById('welcome-subtitle')?.textContent || ''),
                projectsHidden:document.getElementById('nav-projects-teams-v2')?.classList.contains('hidden') ?? true,
                statusFilterHidden:getComputedStyle(document.getElementById('ticket-filter-status')).display === 'none',
                dateFilterHidden:getComputedStyle(document.getElementById('ticket-filter-date')).display === 'none',
                priorityFilterHidden:getComputedStyle(document.getElementById('ticket-filter-priority')).display === 'none',
              }));
              if (errors.length) throw new Error(`Browser errors for ${ccmsId}: ${errors.join(' | ')}`);
              return result;
            } finally {
              await context.close();
            }
          }

          try {
            const reema = await loginAndRead('2002', reemaPassword);
            if (reema.session?.id !== '2002' || reema.session?.role !== 'supervisor') throw new Error(`Reema effective session failed: ${JSON.stringify(reema)}`);
            if (!/2002/.test(reema.subtitle) || !/SUPERVISOR|Supervisor|مشرف/i.test(reema.subtitle)) throw new Error(`Reema Home identity failed: ${JSON.stringify(reema)}`);
            if (!reema.projectsHidden) throw new Error('Projects & Teams must be hidden for Supervisor.');
            if (!reema.statusFilterHidden || !reema.dateFilterHidden || reema.priorityFilterHidden) throw new Error(`Ticket filter deduplication failed: ${JSON.stringify(reema)}`);

            const lana = await loginAndRead('9004', lanaPassword);
            if (lana.session?.id !== '9004' || lana.session?.role !== 'agent' || lana.session?.name !== 'Lana Safar') throw new Error(`Lana login failed: ${JSON.stringify(lana)}`);
            if (!/9004/.test(lana.subtitle) || !/AGENT|Agent|موظف دعم/i.test(lana.subtitle)) throw new Error(`Lana Home identity failed: ${JSON.stringify(lana)}`);
            if (!lana.projectsHidden) throw new Error('Projects & Teams must be hidden for Agent.');

            console.log(JSON.stringify({
              reema:{ id:reema.session.id, role:reema.session.role, projectsHidden:reema.projectsHidden, filterDedup:reema.statusFilterHidden && reema.dateFilterHidden && !reema.priorityFilterHidden },
              lana:{ id:lana.session.id, role:lana.session.role, projectsHidden:lana.projectsHidden },
              result:'PASS',
            }));
          } finally {
            await browser.close();
          }
          NODE
          cat "$GITHUB_WORKSPACE/monday-browser-smoke.log"

      - name: Upload transition smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monday-org-transition-output
          path: |
            monday-browser-smoke.log
            monday-browser-server.log
          if-no-files-found: warn
          retention-days: 7
