name: Phase 1A employee identity preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'employee-model.js'
      - 'employee-identity-seed.js'
      - 'employee-identity-store.js'
      - 'employee-identity-migration.js'
      - 'employee-identity-compat.js'
      - 'phase1a-collections.js'
      - 'phase1a-migration-plan.js'
      - 'phase1a-migration-guard.js'
      - 'project-model.js'
      - 'project-directory.js'
      - 'tools/phase1a-model-preflight.mjs'
      - 'tools/phase1a-reservation-preflight.mjs'
      - 'docs/phase-1a-employee-identity.md'
      - '.github/workflows/phase1a-model-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1a-preflight:
    name: Validate Phase 1A identity foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run pure model tests
        run: node tools/phase1a-model-preflight.mjs

      - name: Verify legacy identity reservations
        run: node tools/phase1a-reservation-preflight.mjs

      - name: Syntax check new browser modules
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            employee-model.js \
            employee-identity-seed.js \
            employee-identity-store.js \
            employee-identity-migration.js \
            employee-identity-compat.js \
            phase1a-collections.js \
            phase1a-migration-plan.js \
            phase1a-migration-guard.js \
            project-model.js \
            project-directory.js; do
            cp "$file" "/tmp/${file%.js}.mjs"
            node --check "/tmp/${file%.js}.mjs"
          done

      - name: Confirm identity changes preserve stable runtime cores
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"

          # Phase 1A originally forbade every runtime wrapper because no later phase
          # existed yet. Later approved phases intentionally mount safe modules from
          # app.js/tickets.js. Keep protecting the stable cores and unrelated feature
          # engines while allowing those wrappers to evolve.
          forbidden='^(app-core\.js|tickets-core\.js|payroll\.js|payroll-core\.js|reports\.js|reports-core\.js|messages\.js|messages-core\.js|groups\.js|groups-core\.js|tasks\.js|meetings\.js|index\.html)$'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            echo 'Identity work unexpectedly changes a stable production core/module.' >&2
            exit 1
          fi

          grep -Fq "import './app-core.js';" app.js
          grep -q "const CORE_URL = new URL('./tickets-core.js'" tickets.js
          echo 'Stable runtime core isolation check: PASS'
